<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Archive Viewer</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS Fixes */
        .transcription-content p {
            text-indent: 0 !important;
            padding-left: 0 !important;
            margin-left: 0 !important;
            white-space: normal;
            text-align: left;
        }
        /* Navigation Styles */
        #page-navigator {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #444;
            color: white;
            margin: 0 10px;
            cursor: pointer;
        }
        /* Cursor Styles */
        .zoomable-image { cursor: zoom-in; }
        .zoomable-image.is-zoomed { cursor: zoom-out; }
        
        /* Loading State */
        .loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
    <header>
        <div>
            <a href="index.html">&larr; Index</a>
            
            <span id="page-indicator">Loading...</span>
            <select id="page-navigator"></select>

            <button id="btn-prev" class="nav-btn">&larr; Vorherige</button>
            <button id="btn-next" class="nav-btn">Nächste &rarr;</button>
        </div>
    </header>
    
    <div class="sub-page-container">
        
        <div class="image-wrapper">
            <img id="main-image" src="" alt="Page Visual" class="zoomable-image" title="Click to Zoom">
        </div>

        <div class="content-wrapper">
            <hr> 
            <div class="pane text-pane">
                <div class="metadata">
                    <strong>Source XML:</strong> <span id="meta-xml"></span><br>
                    <strong>Original File:</strong> <span id="meta-img"></span>
                </div>
                
                <div id="transcription-text" class="transcription-content">
                    <p>Loading content...</p>
                </div>
            </div>
        </div> 
    </div> 

<script src="config.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    
    // 1. GET URL PARAMETERS
    const urlParams = new URLSearchParams(window.location.search);
    const currentProjectId = urlParams.get('project') || 'nomina'; // Default to nomina
    const currentPageId = urlParams.get('id');

    // 2. SELECT CORRECT PROJECT
    // Access the global 'projects' object from config.js
    const projectPages = projects[currentProjectId];

    // Safety check: if project doesn't exist
    if (!projectPages) {
        document.body.innerHTML = "<h1>Error: Project not found. check URL.</h1>";
        return;
    }

    // 3. FIND CURRENT PAGE INDEX
    let currentIndex = -1;
    if (currentPageId) {
        currentIndex = projectPages.findIndex(p => p.id === currentPageId);
    }
    
    // Default to first page if ID is missing or not found
    if (currentIndex === -1) currentIndex = 0;
    
    const pageData = projectPages[currentIndex];

    // 4. UPDATE UI ELEMENTS
    const indicator = document.getElementById('page-indicator');
    const select = document.getElementById('page-navigator');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    // Update Header Text
    indicator.textContent = `${pageData.title} (Seite ${currentIndex + 1} von ${projectPages.length})`;

    // Populate Dropdown
    projectPages.forEach(page => {
        const option = document.createElement('option');
        option.value = page.id;
        option.textContent = page.title;
        if(page.id === pageData.id) option.selected = true;
        select.appendChild(option);
    });

    // --- NAVIGATION LOGIC (CRITICAL FIX) ---
    // We must include "project=${currentProjectId}" in the links, 
    // otherwise it kicks you back to the default book.

    // Handle Dropdown Change
    select.addEventListener('change', (e) => {
        window.location.search = `?project=${currentProjectId}&id=${e.target.value}`;
    });

    // Handle Prev Button
    btnPrev.onclick = () => {
        if(currentIndex > 0) {
            const prevId = projectPages[currentIndex - 1].id;
            window.location.search = `?project=${currentProjectId}&id=${prevId}`;
        }
    };

    // Handle Next Button
    btnNext.onclick = () => {
        if(currentIndex < projectPages.length - 1) {
            const nextId = projectPages[currentIndex + 1].id;
            window.location.search = `?project=${currentProjectId}&id=${nextId}`;
        }
    };

    // Disable buttons if at start/end
    if(currentIndex === 0) btnPrev.disabled = true;
    if(currentIndex === projectPages.length - 1) btnNext.disabled = true;

    // 5. LOAD THE IMAGE
    const imgElement = document.getElementById('main-image');
    const metaImg = document.getElementById('meta-img');
    
    imgElement.src = `images/${pageData.image}`; 
    metaImg.textContent = pageData.image;

    // 6. LOAD AND PARSE XML
    const metaXml = document.getElementById('meta-xml');
    const textBox = document.getElementById('transcription-text');
    
    metaXml.textContent = pageData.xml;

    fetch(`xml/${pageData.xml}`)
        .then(response => {
            if (!response.ok) throw new Error("HTTP error " + response.status);
            return response.text();
        })
        .then(str => {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(str, "text/xml");
            
            // Extract text from <text> tag
            // Using checks to avoid crash if tag is missing
            const textNode = xmlDoc.getElementsByTagName("text")[0];
            if (textNode) {
                textBox.innerHTML = textNode.textContent.trim();
            } else {
                textBox.innerHTML = "<em>No text content found in XML.</em>";
            }
        })
        .catch(err => {
            console.error("Error loading XML:", err);
            textBox.innerHTML = `<p style='color:red'>Error loading transcription file (${pageData.xml}).<br>Check if file exists in xml/ folder.</p>`;
        });

    // 7. ZOOM FEATURE
    imgElement.addEventListener('click', function() {
        this.classList.toggle('is-zoomed');
    });
});
</script>
</body>
</html>
